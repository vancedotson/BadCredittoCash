name: Database migration validation

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-validation.yml"
  push:
    branches: [master]
    paths:
      - "supabase/**"
      - ".github/workflows/database-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.114.0
      - name: Rebuild a disposable database from all migrations
        run: supabase db start
      - name: Check database functions for SQL errors
        run: supabase db lint --local --level error --fail-on error
