name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public application health
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 20 \
            https://vance-dotson.vancedotson.workers.dev/api/health
